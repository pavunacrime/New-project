<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>VIBE HITS · Rádio Cyberpunk 24/7</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,500;14..32,700;14..32,800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #05050A;
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            color: #f0f0f0;
            overflow-x: hidden;
            position: relative;
        }

        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem 2rem 3rem;
        }

        .glass-card, .player-card, .top-hits-list, .dj-card {
            background: rgba(10, 10, 20, 0.55);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            border: 1px solid rgba(179, 0, 255, 0.3);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5), 0 0 12px rgba(0, 229, 255, 0.2);
            transition: all 0.2s ease;
        }

        .glass-card:hover {
            border-color: #00e5ff;
            box-shadow: 0 0 18px rgba(0, 229, 255, 0.5);
        }

        /* Logo em movimento */
        .logo-motion {
            perspective: 800px;
            display: inline-block;
        }
        .neon-logo {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #b100ff, #00e5ff, #ff00aa);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientShift 3s ease infinite, float3d 2.2s infinite ease-in-out, textGlowPulse 1.8s infinite alternate;
            display: inline-block;
            transform-style: preserve-3d;
        }
        @keyframes float3d {
            0% { transform: rotateX(0deg) rotateY(0deg) translateZ(0px); letter-spacing: -1px; }
            25% { transform: rotateX(4deg) rotateY(6deg) translateZ(6px); letter-spacing: 1px; }
            50% { transform: rotateX(-2deg) rotateY(-4deg) translateZ(3px); letter-spacing: -0.5px; }
            75% { transform: rotateX(3deg) rotateY(2deg) translateZ(8px); letter-spacing: 0.5px; }
            100% { transform: rotateX(0deg) rotateY(0deg) translateZ(0px); letter-spacing: -1px; }
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes textGlowPulse {
            0% { text-shadow: 0 0 2px #b100ff, 0 0 5px #00e5ff; opacity: 0.9; }
            100% { text-shadow: 0 0 18px #ff00aa, 0 0 25px #00ffff, 0 0 8px #b100ff; opacity: 1; }
        }

        .badge-247 {
            background: #ff00aa20;
            border: 1px solid #ff00aa;
            border-radius: 30px;
            padding: 0.3rem 0.9rem;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .slogan {
            font-size: 0.9rem;
            background: rgba(0,0,0,0.6);
            padding: 0.4rem 1rem;
            border-radius: 40px;
            border-left: 3px solid #ff00aa;
            font-weight: 500;
        }
        .live-badge {
            display: inline-block;
            background-color: #ff0044;
            border-radius: 30px;
            padding: 0.2rem 0.9rem;
            font-size: 0.7rem;
            font-weight: bold;
            letter-spacing: 1px;
            animation: blinkLive 1s infinite;
        }
        @keyframes blinkLive {
            0% { opacity: 1; background: #ff0044; box-shadow: 0 0 0px #ff0044;}
            50% { opacity: 0.7; background: #ff0077; box-shadow: 0 0 8px #ff00aa;}
            100% { opacity: 1; background: #ff0044; }
        }
        .equalizer-animated {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            height: 60px;
            margin: 20px 0;
        }
        .eq-bar {
            width: 8px;
            height: 20px;
            background: cyan;
            border-radius: 4px;
            animation: bounce 0.5s infinite alternate ease-in-out;
        }
        @keyframes bounce {
            0% { height: 12px; background: #b100ff; }
            100% { height: 48px; background: #00ffff; }
        }
        .eq-bar:nth-child(2){ animation-duration: 0.7s; animation-delay: 0.1s; }
        .eq-bar:nth-child(3){ animation-duration: 0.4s; animation-delay: 0.2s; }
        .eq-bar:nth-child(4){ animation-duration: 0.6s; animation-delay: 0s; }
        .eq-bar:nth-child(5){ animation-duration: 0.5s; animation-delay: 0.3s; }
        .eq-bar:nth-child(6){ animation-duration: 0.8s; animation-delay: 0.1s; }

        .player-controls {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: 15px 0;
        }
        .player-controls button {
            background: none;
            border: none;
            font-size: 2rem;
            color: #00e5ff;
            cursor: pointer;
            transition: 0.2s;
            filter: drop-shadow(0 0 5px cyan);
        }
        .player-controls button:hover {
            transform: scale(1.1);
            color: #ff00aa;
        }

        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.8rem;
            margin-bottom: 2rem;
        }

        .top-hits-list {
            padding: 1.5rem;
        }
        .hit-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 0;
            border-bottom: 1px solid rgba(0,229,255,0.2);
        }
        .hit-votos {
            color: #00ffcc;
            font-weight: bold;
        }

        .dj-grid {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 0.8rem;
        }
        .dj-card {
            flex: 1;
            padding: 1rem;
            text-align: center;
            min-width: 110px;
            background: rgba(10,10,20,0.6);
            border-radius: 1.5rem;
        }
        .insta-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.6rem;
            margin: 1rem 0;
        }
        .insta-post {
            background: #1a1a2e;
            aspect-ratio: 1 / 1;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            border: 1px solid cyan;
        }
        .whatsapp-fixed {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #25D366;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 0 20px #25d366;
            z-index: 999;
            cursor: pointer;
            transition: 0.2s;
        }
        footer {
            text-align: center;
            margin-top: 3rem;
            font-size: 0.75rem;
            opacity: 0.7;
        }

        @media (max-width: 780px) {
            .container { padding: 1rem; }
            .grid-2col { grid-template-columns: 1fr; }
            .neon-logo { font-size: 2.2rem; }
            .logo-area { flex-direction: column; align-items: center; text-align: center; }
        }
    </style>
</head>
<body>
<canvas id="canvas-bg"></canvas>
<div class="container">
    <div class="logo-area">
        <div class="logo-motion">
            <div class="neon-logo">VIBE HITS</div>
        </div>
        <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px;">
            <span class="badge-247"><i class="fas fa-broadcast-tower"></i> 24/7 LIVE</span>
            <span class="badge-247"><i class="fas fa-headphones"></i> Rádio online</span>
            <span class="slogan"><i class="fas fa-waveform"></i> “A frequência da nova geração.”</span>
        </div>
    </div>

    <!-- Player com stream real -->
    <div class="player-card" style="margin-bottom: 1.8rem; padding: 1.5rem;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span class="live-badge"><i class="fas fa-circle"></i> AO VIVO</span>
            <span><i class="fas fa-head-side-headphones"></i> <span id="ouvinteCount">1.2k</span> ouvindo</span>
        </div>
        <div class="equalizer-animated" id="equalizerBars">
            <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
        </div>
        <div class="player-controls">
            <button id="playPauseBtn"><i class="fas fa-play-circle"></i></button>
            <button id="volDown"><i class="fas fa-volume-down"></i></button>
            <button id="volUp"><i class="fas fa-volume-up"></i></button>
        </div>
        <div class="now-playing" style="text-align: center; margin-top: 10px;">
            <img src="https://placehold.co/60x60/1a1a2e/cyan?text=🎧" style="border-radius: 50%; width: 60px; margin-bottom: 6px;" alt="capa">
            <div class="track-name" id="trackName" style="font-size: 1.3rem; font-weight: bold;">Carregando stream...</div>
            <div id="artistName">VIBE HITS · Ao vivo</div>
        </div>
        <audio id="radioStream" preload="none" crossorigin="anonymous"></audio>
    </div>

    <!-- Grid com TOP HITS e LOCUTORES (apenas funcionais visualmente) -->
    <div class="grid-2col">
        <div class="top-hits-list glass-card">
            <h3><i class="fas fa-fire-flame"></i> TOP HITS 🔥</h3>
            <div id="topHitsContainer"></div>
        </div>
        <div class="glass-card" style="padding: 1.5rem;">
            <h3><i class="fas fa-microphone-alt"></i> 🎤 LOCUTORES</h3>
            <div class="dj-grid" id="djGrid"></div>
        </div>
    </div>

    <!-- Feed Instagram (visual) -->
    <div class="glass-card" style="padding: 1.2rem; margin-bottom: 1.8rem;">
        <h3><i class="fab fa-instagram"></i> @VIBEHITS_RADIO · feed</h3>
        <div class="insta-grid" id="instaGrid"></div>
    </div>

    <footer>🌌 VIBE HITS · Transmitindo energia 24/7 · Só hit atrás de hit · Conecte-se na batida</footer>
</div>

<div class="whatsapp-fixed" id="whatsappBtn">
    <i class="fab fa-whatsapp"></i>
</div>

<script>
    (function() {
        // ========== FUNDO ANIMADO (partículas + aurora) ==========
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        const PARTICLE_COUNT = 120;
        let mouseX = 0, mouseY = 0;

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            initParticles();
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 3 + 1,
                    speedX: (Math.random() - 0.5) * 0.3,
                    speedY: (Math.random() - 0.5) * 0.3,
                    color: `hsla(${Math.random() * 60 + 260}, 90%, 65%, 0.7)`
                });
            }
        }

        function drawAurora() {
            const grad = ctx.createLinearGradient(0, 0, width, height);
            grad.addColorStop(0, '#05001c');
            grad.addColorStop(0.5, '#0f0b2e');
            grad.addColorStop(1, '#1a0b2e');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);
            for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                const offset = Date.now() * 0.002 + i;
                for (let x = 0; x < width; x += 20) {
                    let y = height * 0.3 + Math.sin(x * 0.008 + offset) * 35 + Math.cos(x * 0.02 + i) * 20;
                    ctx.lineTo(x, y);
                }
                ctx.strokeStyle = `rgba(0, 229, 255, 0.25)`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function drawParticles() {
            for (let p of particles) {
                const dx = p.x - mouseX;
                const dy = p.y - mouseY;
                const dist = Math.hypot(dx, dy);
                if (dist < 100) {
                    const angle = Math.atan2(dy, dx);
                    const force = (100 - dist) / 100 * 1.2;
                    p.x += Math.cos(angle) * force;
                    p.y += Math.sin(angle) * force;
                } else {
                    p.x += p.speedX;
                    p.y += p.speedY;
                }
                if (p.x < 0) p.x = width;
                if (p.x > width) p.x = 0;
                if (p.y < 0) p.y = height;
                if (p.y > height) p.y = 0;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 6;
                ctx.shadowColor = '#b100ff';
                ctx.fill();
            }
            ctx.shadowBlur = 0;
        }

        function animateBg() {
            drawAurora();
            drawParticles();
            requestAnimationFrame(animateBg);
        }
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
        resizeCanvas();
        animateBg();

        // ========== STREAM REAL ==========
        const STREAM_URL = "https://stm16.xcast.com.br:7680/stream";
        const audioElement = document.getElementById('radioStream');
        const playBtn = document.getElementById('playPauseBtn');
        const trackNameSpan = document.getElementById('trackName');
        const artistSpan = document.getElementById('artistName');
        const ouvinteSpan = document.getElementById('ouvinteCount');
        let isPlaying = false;
        audioElement.src = STREAM_URL;

        function startPlay() {
            audioElement.play().then(() => {
                isPlaying = true;
                playBtn.innerHTML = '<i class="fas fa-pause-circle"></i>';
                trackNameSpan.innerText = "🔴 TRANSMISSÃO AO VIVO";
                artistSpan.innerText = "VIBE HITS · 24/7";
                animateEqualizer(true);
            }).catch((error) => {
                console.error("Erro ao reproduzir stream:", error);
                alert("Não foi possível iniciar o stream. Verifique sua conexão ou tente novamente.");
                isPlaying = false;
                playBtn.innerHTML = '<i class="fas fa-play-circle"></i>';
                animateEqualizer(false);
            });
        }

        function stopPlay() {
            audioElement.pause();
            audioElement.currentTime = 0;
            isPlaying = false;
            playBtn.innerHTML = '<i class="fas fa-play-circle"></i>';
            trackNameSpan.innerText = "Pausado";
            artistSpan.innerText = "Clique no PLAY para ouvir";
            animateEqualizer(false);
        }

        playBtn.addEventListener('click', () => {
            if (isPlaying) stopPlay();
            else startPlay();
        });

        let eqInterval = null;
        function animateEqualizer(active) {
            const bars = document.querySelectorAll('.eq-bar');
            if (active) {
                if (eqInterval) clearInterval(eqInterval);
                eqInterval = setInterval(() => {
                    if (isPlaying) {
                        bars.forEach(bar => {
                            bar.style.height = Math.floor(Math.random() * 35) + 15 + 'px';
                        });
                    }
                }, 150);
            } else {
                if (eqInterval) clearInterval(eqInterval);
                bars.forEach(bar => bar.style.height = '20px');
            }
        }

        audioElement.addEventListener('playing', () => {
            isPlaying = true;
            playBtn.innerHTML = '<i class="fas fa-pause-circle"></i>';
            trackNameSpan.innerText = "🔴 TRANSMISSÃO AO VIVO";
            animateEqualizer(true);
        });
        audioElement.addEventListener('pause', () => {
            if (audioElement.paused) {
                isPlaying = false;
                playBtn.innerHTML = '<i class="fas fa-play-circle"></i>';
                animateEqualizer(false);
            }
        });
        audioElement.addEventListener('error', () => {
            if (isPlaying) {
                setTimeout(() => { if (isPlaying) { audioElement.load(); audioElement.play().catch(e=>console.log); } }, 3000);
            }
        });

        document.getElementById('volDown').addEventListener('click', () => {
            if (audioElement.volume > 0) {
                audioElement.volume = Math.max(0, audioElement.volume - 0.1);
            }
        });
        document.getElementById('volUp').addEventListener('click', () => {
            if (audioElement.volume < 0.99) {
                audioElement.volume = Math.min(1, audioElement.volume + 0.1);
            }
        });

        // Simulação de ouvintes
        setInterval(() => {
            if (isPlaying) {
                let current = parseInt(ouvinteSpan.innerText);
                if (isNaN(current)) current = 1200;
                let variation = Math.floor(Math.random() * 30) - 10;
                let newCount = current + variation;
                if (newCount < 800) newCount = 800;
                if (newCount > 2800) newCount = 2800;
                ouvinteSpan.innerText = newCount;
            }
        }, 15000);

        // TOP HITS (estático)
        const topHits = [
            { nome: "Blinding Lights", artista: "The Weeknd", votos: 512 },
            { nome: "Flowers", artista: "Miley Cyrus", votos: 489 },
            { nome: "VIBE HITS ANTHEM", artista: "DJ NIX", votos: 367 },
            { nome: "Supernova", artista: "Kylie", votos: 298 },
            { nome: "Levitating", artista: "Dua Lipa", votos: 254 }
        ];
        const container = document.getElementById('topHitsContainer');
        topHits.forEach((hit, idx) => {
            const div = document.createElement('div');
            div.className = 'hit-item';
            div.innerHTML = `<div><strong>${idx+1}</strong> ${hit.nome} · ${hit.artista}</div><div class="hit-votos">🔥 ${hit.votos}</div>`;
            container.appendChild(div);
        });

        // Locutores
        const djList = [
            { nome: "DJ NYX", horario: "20h - 00h", icone: "🎧" },
            { nome: "MC AURORA", horario: "00h - 04h", icone: "🎤" },
            { nome: "VIBE SELECTOR", horario: "14h - 18h", icone: "🔊" }
        ];
        const djGrid = document.getElementById('djGrid');
        djList.forEach(dj => {
            const card = document.createElement('div');
            card.className = 'dj-card';
            card.innerHTML = `<div style="font-size:2rem;">${dj.icone}</div><strong>${dj.nome}</strong><br><small>${dj.horario}</small>`;
            djGrid.appendChild(card);
        });

        // Instagram feed (visual placeholder)
        const instaGrid = document.getElementById('instaGrid');
        for (let i = 0; i < 6; i++) {
            const post = document.createElement('div');
            post.className = 'insta-post';
            post.innerHTML = `<i class="fas fa-music" style="font-size: 2rem; color:cyan;"></i><br><span style="font-size:0.7rem;">vibe.hits</span>`;
            instaGrid.appendChild(post);
        }

        // WhatsApp fixo
        document.getElementById('whatsappBtn').addEventListener('click', () => {
            alert("📱 WhatsApp: (11) 99999-1234 \nConverse com a gente pelo Zap!");
        });
    })();
</script>
</body>
</html>
