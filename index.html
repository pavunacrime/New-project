<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pavuna</title>
  
  <!-- Fontes e Ícones -->
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&family=Orbitron:wght@900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #1e1e1e;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Fira Code', monospace;
    }

    /* Botão do Instagram no canto superior direito */
    .instagram-btn {
      position: fixed;
      top: 25px;
      right: 25px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      text-decoration: none;
      font-size: 1rem;
      font-weight: bold;
      background: rgba(30, 30, 30, 0.7);
      border: 1px solid #ff003c;
      padding: 10px 18px;
      border-radius: 8px;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(255, 0, 60, 0.3);
    }

    .instagram-btn i {
      font-size: 1.3rem;
      color: #ff003c;
      transition: transform 0.3s ease;
    }

    /* Efeito de brilho neon ao passar o mouse */
    .instagram-btn:hover {
      background: #ff003c;
      color: #fff;
      box-shadow: 0 0 20px #ff003c, 0 0 40px #ff0000;
      transform: translateY(-2px);
    }

    .instagram-btn:hover i {
      color: #fff;
      transform: scale(1.1);
    }

    /* Nome PAVUNA centralizado e responsivo */
    .center-title {
      position: relative;
      z-index: 10;
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2.2rem, 10vw, 5rem);
      font-weight: 900;
      color: #ffffff;
      letter-spacing: clamp(4px, 2vw, 12px);
      text-transform: uppercase;
      text-shadow: 
        0 0 10px #ff003c,
        0 0 25px #ff003c,
        0 0 50px #ff003c;
      user-select: none;
      pointer-events: none;
      text-align: center;
      padding: 0 10px;
    }

    /* Canvas para a chuva de código */
    #rainCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Ajustes específicos para telas de celular */
    @media (max-width: 600px) {
      .instagram-btn {
        top: 15px;
        right: 15px;
        padding: 8px 14px;
        font-size: 0.85rem;
      }

      .instagram-btn i {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Link do Instagram configurado -->
  <a href="https://www.instagram.com/pavuna_crime/" target="_blank" rel="noopener noreferrer" class="instagram-btn">
    <i class="fa-brands fa-instagram"></i>
    <span>Instagram</span>
  </a>

  <!-- Canvas da Chuva -->
  <canvas id="rainCanvas"></canvas>

  <!-- Nome no Centro -->
  <h1 class="center-title">PAVUNA</h1>

  <script>
    const canvas = document.getElementById('rainCanvas');
    const ctx = canvas.getContext('2d');

    let colWidth, fontSize, columns;
    const drops = [];

    // Frases de Python
    const pythonSnippets = [
      'def main():', 
      'class Pavuna:', 
      'import time', 
      'import random',
      'self.status = "ONLINE"', 
      'print("PAVUNA")', 
      'if __name__ == "__main__":',
      'return True', 
      '@classmethod', 
      'request_seen(self)', 
      'file.write()',
      'self.fingerprints', 
      'self.logger', 
      'for i in range(10):', 
      'yield data'
    ];

    // Cores de sintaxe Python (VS Code Dark Theme)
    const colors = [
      '#569cd6', // Azul
      '#4ec9b0', // Ciano
      '#ce9178', // Laranja
      '#dcdcaa', // Amarelo
      '#c586c0', // Roxo
      '#b5cea8'  // Verde
    ];

    function initDrops() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      // Se for celular, usamos uma fonte levemente menor e colunas mais estreitas
      const isMobile = window.innerWidth <= 600;
      fontSize = isMobile ? 12 : 16;
      colWidth = isMobile ? 100 : 140;

      columns = Math.ceil(canvas.width / colWidth);
      drops.length = 0; // Limpa o array atual

      for (let i = 0; i < columns; i++) {
        drops[i] = {
          x: i * colWidth + 5,
          y: Math.random() * -50,
          text: pythonSnippets[Math.floor(Math.random() * pythonSnippets.length)],
          color: colors[Math.floor(Math.random() * colors.length)],
          speed: 0.12 + Math.random() * 0.2
        };
      }
    }

    initDrops();
    window.addEventListener('resize', initDrops);

    function draw() {
      // CORREÇÃO DO EMBAÇAMENTO: Aumentamos a opacidade do fundo para limpar mais rápido e não deixar vulto/borrão
      ctx.fillStyle = 'rgba(30, 30, 30, 0.4)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = `bold ${fontSize}px "Fira Code", monospace`;
      ctx.shadowBlur = 0;

      for (let i = 0; i < drops.length; i++) {
        const drop = drops[i];

        ctx.fillStyle = drop.color;
        
        // CORREÇÃO DO EMBAÇAMENTO: Math.floor garante que a posição seja um número inteiro (evita o borrão de renderização)
        const pixelY = Math.floor(drop.y * fontSize);
        ctx.fillText(drop.text, drop.x, pixelY);

        if (pixelY > canvas.height) {
          drop.y = -2;
          drop.text = pythonSnippets[Math.floor(Math.random() * pythonSnippets.length)];
          drop.color = colors[Math.floor(Math.random() * colors.length)];
        }

        drop.y += drop.speed;
      }
    }

    setInterval(draw, 33);
  </script>
</body>
</html>
