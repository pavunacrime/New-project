<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pavuna</title>
  
  <!-- Fontes e Ícones -->
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&family=Orbitron:wght@900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #1e1e1e;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Fira Code', monospace;
    }

    /* Contador de Visitas (Canto Superior Esquerdo) */
    .visitor-count {
      position: fixed;
      top: 25px;
      left: 25px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      font-size: 0.9rem;
      font-weight: bold;
      background: rgba(30, 30, 30, 0.7);
      border: 1px solid #ff003c;
      padding: 10px 18px;
      border-radius: 8px;
      backdrop-filter: blur(5px);
      box-shadow: 0 0 10px rgba(255, 0, 60, 0.3);
      user-select: none;
    }

    .visitor-count i {
      font-size: 1.1rem;
      color: #ff003c;
    }

    #count {
      color: #00ffcc;
    }

    /* Botão do Instagram (Canto Superior Direito) */
    .instagram-btn {
      position: fixed;
      top: 25px;
      right: 25px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      text-decoration: none;
      font-size: 1rem;
      font-weight: bold;
      background: rgba(30, 30, 30, 0.7);
      border: 1px solid #ff003c;
      padding: 10px 18px;
      border-radius: 8px;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(255, 0, 60, 0.3);
    }

    .instagram-btn i {
      font-size: 1.3rem;
      color: #ff003c;
      transition: transform 0.3s ease;
    }

    .instagram-btn:hover {
      background: #ff003c;
      color: #fff;
      box-shadow: 0 0 20px #ff003c, 0 0 40px #ff0000;
      transform: translateY(-2px);
    }

    .instagram-btn:hover i {
      color: #fff;
      transform: scale(1.1);
    }

    /* Caixa do Salve / Discord (Canto Inferior) */
    .discord-box {
      position: fixed;
      bottom: 25px;
      z-index: 100;
      display: flex;
      gap: 10px;
      background: rgba(30, 30, 30, 0.85);
      border: 1px solid #ff003c;
      padding: 12px 18px;
      border-radius: 8px;
      backdrop-filter: blur(5px);
      box-shadow: 0 0 15px rgba(255, 0, 60, 0.3);
    }

    .discord-box input {
      background: #121212;
      border: 1px solid #ff003c;
      color: #fff;
      padding: 8px 12px;
      border-radius: 5px;
      font-family: 'Fira Code', monospace;
      font-size: 0.85rem;
      outline: none;
      width: 180px;
    }

    .discord-box input::placeholder {
      color: #888;
    }

    .discord-box button {
      background: #ff003c;
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 5px;
      font-family: 'Fira Code', monospace;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .discord-box button:hover {
      background: #00ffcc;
      color: #121212;
      box-shadow: 0 0 10px #00ffcc;
    }

    /* Nome PAVUNA Centralizado */
    .center-title {
      position: relative;
      z-index: 10;
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2.2rem, 10vw, 5rem);
      font-weight: 900;
      color: #ffffff;
      letter-spacing: clamp(4px, 2vw, 12px);
      text-transform: uppercase;
      text-shadow: 
        0 0 10px #ff003c,
        0 0 25px #ff003c,
        0 0 50px #ff003c;
      user-select: none;
      pointer-events: none;
      text-align: center;
      padding: 0 10px;
    }

    /* Canvas da Chuva */
    #rainCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Ajustes para Celular */
    @media (max-width: 600px) {
      .instagram-btn {
        top: 15px;
        right: 15px;
        padding: 8px 12px;
        font-size: 0.8rem;
      }

      .visitor-count {
        top: 15px;
        left: 15px;
        padding: 8px 12px;
        font-size: 0.8rem;
      }

      .discord-box {
        bottom: 15px;
        padding: 8px 12px;
      }

      .discord-box input {
        width: 130px;
        font-size: 0.75rem;
      }

      .discord-box button {
        font-size: 0.75rem;
        padding: 6px 10px;
      }
    }
  </style>
</head>
<body>

  <!-- Contador de Visitas -->
  <div class="visitor-count">
    <i class="fa-solid fa-eye"></i>
    <span>Visitas: <span id="count">...</span></span>
  </div>

  <!-- Link do Instagram -->
  <a href="https://www.instagram.com/pavuna_crime/" target="_blank" rel="noopener noreferrer" class="instagram-btn">
    <i class="fa-brands fa-instagram"></i>
    <span>Instagram</span>
  </a>

  <!-- Caixa de Envio de Salve -->
  <div class="discord-box">
    <input type="text" id="visitorName" placeholder="Seu Nome / Apelido" maxlength="20">
    <button onclick="sendToDiscord()">Mandar Salve</button>
  </div>

  <!-- Canvas da Chuva -->
  <canvas id="rainCanvas"></canvas>

  <!-- Nome Central -->
  <h1 class="center-title">PAVUNA</h1>

  <!-- Script de Envio pro Discord via API Protegida -->
  <script>
    async function sendToDiscord() {
      const nameInput = document.getElementById('visitorName');
      const name = nameInput.value.trim() || 'Anônimo';

      try {
        // 1. Pegar o IP do Visitante
        const ipResponse = await fetch('https://api.ipify.org?format=json');
        const ipData = await ipResponse.json();
        const userIp = ipData.ip || 'Não identificado';

        // 2. Enviar dados para o Backend seguro (API da Vercel)
        const response = await fetch('/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, userIp })
        });

        if (response.ok) {
          alert('Salve enviado com sucesso!');
          nameInput.value = '';
        } else {
          alert('Erro ao enviar o salve. Tente novamente mais tarde.');
        }
      } catch (error) {
        console.error('Erro ao enviar:', error);
        alert('Erro de comunicação com o servidor.');
      }
    }
  </script>

  <!-- Script do Contador de Visitas -->
  <script>
    async function updateVisitorCount() {
      try {
        const response = await fetch('https://api.counterapi.dev/v1/pavunacrime/site/up');
        const data = await response.json();
        document.getElementById('count').innerText = data.count;
      } catch (error) {
        console.error('Erro ao carregar o contador:', error);
        document.getElementById('count').innerText = '1';
      }
    }
    updateVisitorCount();
  </script>

  <!-- Script da Chuva de Código Python -->
  <script>
    const canvas = document.getElementById('rainCanvas');
    const ctx = canvas.getContext('2d');

    let colWidth, fontSize, columns;
    const drops = [];

    const pythonSnippets = [
      'def main():', 
      'class Pavuna:', 
      'import time', 
      'import random',
      'self.status = "ONLINE"', 
      'print("PAVUNA")', 
      'if __name__ == "__main__":',
      'return True', 
      '@classmethod', 
      'request_seen(self)', 
      'file.write()',
      'self.fingerprints', 
      'self.logger', 
      'for i in range(10):', 
      'yield data'
    ];

    const colors = [
      '#569cd6', '#4ec9b0', '#ce9178', '#dcdcaa', '#c586c0', '#b5cea8'
    ];

    function initDrops() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const isMobile = window.innerWidth <= 600;
      fontSize = isMobile ? 12 : 16;
      colWidth = isMobile ? 100 : 140;

      columns = Math.ceil(canvas.width / colWidth);
      drops.length = 0;

      for (let i = 0; i < columns; i++) {
        drops[i] = {
          x: i * colWidth + 5,
          y: Math.random() * -50,
          text: pythonSnippets[Math.floor(Math.random() * pythonSnippets.length)],
          color: colors[Math.floor(Math.random() * colors.length)],
          speed: 0.12 + Math.random() * 0.2
        };
      }
    }

    initDrops();
    window.addEventListener('resize', initDrops);

    function draw() {
      ctx.fillStyle = 'rgba(30, 30, 30, 0.25)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = `bold ${fontSize}px "Fira Code", monospace`;
      ctx.shadowBlur = 0;

      for (let i = 0; i < drops.length; i++) {
        const drop = drops[i];

        ctx.fillStyle = drop.color;
        
        const pixelY = drop.y * fontSize;
        ctx.fillText(drop.text, drop.x, pixelY);

        if (pixelY > canvas.height) {
          drop.y = -2;
          drop.text = pythonSnippets[Math.floor(Math.random() * pythonSnippets.length)];
          drop.color = colors[Math.floor(Math.random() * colors.length)];
        }

        drop.y += drop.speed;
      }
    }

    setInterval(draw, 33);
  </script>

  <!-- Vercel Web Analytics (Método Oficial) -->
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>

</body>
</html>
